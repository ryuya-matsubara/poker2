name: Fix poker2 runtime

on:
  push:
    paths:
      - '.github/workflows/fix-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime functions removed by UI cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="function showHeroActions(){let acts=legal(0);$('actions').innerHTML=acts.map(([a,t])=>`<button class=\"btn ${a==='fold'?'danger':(a.includes('bet')||a==='raise'||a==='allin')?'aggressive':''}\" data-a=\"${a}\">${t}</button>`).join('');$('actions').querySelectorAll('button').forEach(b=>b.onclick=()=>perform(0,b.dataset.a));}\n"
          if marker not in s:
              raise SystemExit('showHeroActions marker not found')
          if 'function render(reveal=false)' in s:
              raise SystemExit('render already exists')
          restored = r'''function endByFold(){let w=active()[0].i;game.players[w].stack+=game.pot;let text=`${game.players[w].name} が ${fmt(game.pot)} を獲得`;game.pot=0;endHand(text,w===0)}
function showdown(){while(game.board.length<5)game.board.push(game.deck.pop());let eligible=game.players.map((p,i)=>({p,i})).filter(x=>!x.p.fold);let levels=[...new Set(game.players.map(p=>p.total).filter(x=>x>0))].sort((a,b)=>a-b),prev=0,awards=Array(6).fill(0);for(const lv of levels){let contributors=game.players.map((p,i)=>({p,i})).filter(x=>x.p.total>=lv);let pot=(lv-prev)*contributors.length;let contenders=eligible.filter(x=>x.p.total>=lv);if(contenders.length){let scores=contenders.map(x=>[x.i,bestScore(x.p.hole.concat(game.board))]),best=Math.max(...scores.map(x=>x[1])),wins=scores.filter(x=>x[1]===best).map(x=>x[0]);for(const w of wins)awards[w]+=pot/wins.length}prev=lv}awards.forEach((x,i)=>game.players[i].stack+=x);let lines=awards.map((x,i)=>x>0?`${game.players[i].name} ${fmt(x)}`:null).filter(Boolean).join(' / ');game.pot=0;endHand(`ショーダウン: ${lines}`,awards[0]>0)}
function endHand(text,heroWin){game.done=true;game.queue=[];game.players.forEach(p=>p.action='');render(true);$('result').innerHTML=`<b class="${heroWin?'win':'loss'}">${text}</b>`;$('modalTitle').textContent='ハンド終了';$('modalText').textContent=text+'\n\n次のハンドではボタンが1席進みます。';$('modal').hidden=false}
function fiveScore(cs){let vals=cs.map(c=>RANKS.indexOf(c.r)+2).sort((a,b)=>b-a),cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);let uniq=[...new Set(vals)];if(uniq[0]===14)uniq.push(1);let sh=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4){sh=uniq[i];break}let flush=cs.every(c=>c.s===cs[0].s),groups=Object.entries(cnt).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v);let cat,k;if(flush&&sh){cat=8;k=[sh]}else if(groups[0].n===4){cat=7;k=[groups[0].v,groups[1].v]}else if(groups[0].n===3&&groups[1].n===2){cat=6;k=[groups[0].v,groups[1].v]}else if(flush){cat=5;k=vals}else if(sh){cat=4;k=[sh]}else if(groups[0].n===3){cat=3;k=[groups[0].v,...groups.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)]}else if(groups[0].n===2&&groups[1].n===2){let ps=[groups[0].v,groups[1].v].sort((a,b)=>b-a);cat=2;k=[...ps,groups.find(x=>x.n===1).v]}else if(groups[0].n===2){cat=1;k=[groups[0].v,...groups.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)]}else{cat=0;k=vals}let n=cat*1e10;for(let i=0;i<5;i++)n+=(k[i]||0)*Math.pow(15,4-i);return n}
function bestScore(cs){if(cs.length<5){let v=cs.map(c=>RANKS.indexOf(c.r)+2).sort((a,b)=>b-a);return v.reduce((a,x)=>a*15+x,0)}let best=-1,n=cs.length;for(let a=0;a<n-4;a++)for(let b=a+1;b<n-3;b++)for(let c=b+1;c<n-2;c++)for(let d=c+1;d<n-1;d++)for(let e=d+1;e<n;e++)best=Math.max(best,fiveScore([cs[a],cs[b],cs[c],cs[d],cs[e]]));return best}
function render(reveal=false){if(!game)return;let coords=[[50,83],[18,68],[18,28],[50,16],[82,28],[82,68]];$('seats').innerHTML=game.players.map((p,i)=>{let [x,y]=coords[i],hero=i===0,show=hero||(reveal&&!p.fold);return `<div class="seat ${hero?'hero':''} ${p.fold?'folded':''} ${game.queue[0]===i?'active':''}" style="left:${x}%;top:${y}%"><div class="name">${p.name}<span class="badge">${posForSeat(i)}${i===button?' · D':''}</span></div><div class="stack">${fmt(p.stack)}</div><div class="bet">投入 ${fmt(p.total)}</div><span class="action-label">${p.action||' '}</span><div class="seat-cards">${show?p.hole.map(c=>cardHtml(c,true)).join(''):p.fold?'':cardHtml(null,true,true)+cardHtml(null,true,true)}</div></div>`}).join('');$('pot').textContent=fmt(game.pot);$('board').innerHTML=game.board.map(c=>cardHtml(c)).join('');$('street').textContent=game.street.toUpperCase();$('heroCards').innerHTML=game.players[0].hole.map(c=>cardHtml(c)).join('');$('turnStatus').textContent=game.done?'ハンド終了':game.queue[0]===0?'あなたの番':game.queue.length?`${game.players[game.queue[0]].name} の番`:'処理中';if(game.queue[0]!==0)$('actions').innerHTML='';}
'''
          s=s.replace(marker, marker+restored)
          p.write_text(s)
          PY
      - name: Check JavaScript and required runtime functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script>')+8; b=s.index('</script>',a); Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
          grep -q 'function render(reveal=false)' index.html
          grep -q 'function showdown()' index.html
          grep -q 'function bestScore(cs)' index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix blank poker table runtime error'
          git push

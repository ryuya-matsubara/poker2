name: Show inline results and action percentages

on:
  push:
    paths:
      - '.github/workflows/inline-result-percentages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hand result and hero action UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          # Give percentages a compact second line inside each action button.
          s=s.replace('.btn{border:1px solid #547144;background:var(--green);color:#14200f;padding:10px 14px;border-radius:9px;font-weight:800;min-width:92px}',
                      '.btn{border:1px solid #547144;background:var(--green);color:#14200f;padding:10px 14px;border-radius:9px;font-weight:800;min-width:92px}.action-pct{display:block;font-size:11px;font-weight:700;opacity:.72;margin-top:2px}')

          # Clear the previous result when a new hand starts.
          needle='function startHand(reset=false){\n'
          if needle not in s:
              raise SystemExit('startHand not found')
          s=s.replace(needle, needle+" if($('result'))$('result').innerHTML='';\n", 1)

          # Show showdown winnings as plain result text, without the 'ショーダウン:' prefix.
          old="let lines=awards.map((x,i)=>x>0?`${game.players[i].name} ${fmt(x)}`:null).filter(Boolean).join(' / ');game.pot=0;endHand(`ショーダウン: ${lines}`,awards[0]>0)"
          new="let lines=awards.map((x,i)=>x>0?`${game.players[i].name} が ${fmt(x)} を獲得`:null).filter(Boolean).join(' / ');game.pot=0;endHand(lines,awards[0]>0)"
          if old not in s:
              raise SystemExit('showdown result formatter not found')
          s=s.replace(old,new,1)

          # Keep the same screen at the end of a hand. No modal/title/explanatory message.
          end_pat=r"function endHand\(text,heroWin\)\{.*?\}\nfunction fiveScore"
          m=re.search(end_pat,s,flags=re.S)
          if not m:
              raise SystemExit('endHand block not found')
          replacement="""function endHand(text,heroWin){game.done=true;game.queue=[];game.players.forEach(p=>p.action='');render(true);$('result').textContent=text;$('actions').innerHTML='<button class=\"btn\" id=\"nextInline\">次のハンド</button>';$('nextInline').onclick=()=>startHand(false)}
function fiveScore"""
          s=s[:m.start()]+replacement+s[m.end():]

          # Add exact public-data percentages to each available hero action.
          hero_pat=r"function showHeroActions\(\)\{.*?\}\n(?=function endByFold|\$\('nextHand'\))"
          m=re.search(hero_pat,s,flags=re.S)
          if not m:
              raise SystemExit('showHeroActions block not found')
          hero="""function showHeroActions(){let acts=legal(0),s=preStrategy(0),map=acts.map(x=>x[0]);let preferredAgg=map.includes('raise')?'raise':map.includes('bet')?'bet':map.includes('allin')?'allin':null;function pct(a){if(!s)return null;if(a==='fold')return s.fold;if(a==='call'||a==='check')return s.call;if(a==='bet'||a==='raise'||a==='allin')return a===preferredAgg?s.raise:0;return 0}$('actions').innerHTML=acts.map(([a,t])=>{let v=pct(a),q=v==null?'—':`${Math.round(v*100)}%`;return `<button class=\"btn ${a==='fold'?'danger':(a.includes('bet')||a==='raise'||a==='allin')?'aggressive':''}\" data-a=\"${a}\">${t}<span class=\"action-pct\">${q}</span></button>`}).join('');$('actions').querySelectorAll('button').forEach(b=>b.onclick=()=>perform(0,b.dataset.a));}
"""
          s=s[:m.start()]+hero+s[m.end():]

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script>')+8; b=s.index('</script>',a); Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
          grep -q 'action-pct' index.html
          grep -q 'nextInline' index.html
          ! grep -q "endHand(\`ショーダウン:" index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show inline results and hero action percentages'
          git push

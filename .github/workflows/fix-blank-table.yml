name: Fix blank table
on:
  push:
    paths:
      - '.github/workflows/fix-blank-table.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('index.html')
          cur=p.read_text()
          old=subprocess.check_output(['git','show','7bd01ced9254bd7820af76ff16302cad7e5e57cb:index.html'], text=True)
          a=old.index('function endByFold()')
          b=old.index("$('nextHand').onclick", a)
          block=old[a:b]
          block=block.replace("<div class=\"stack\">${fmt(p.stack)} · ${money(p.stack)}</div>", "<div class=\"stack\">${fmt(p.stack)}</div>")
          for line in [
              "$('heroStack').textContent=`${fmt(game.players[0].stack)} / ${money(game.players[0].stack)}`;",
              "$('profit').textContent=`${game.players[0].stack+game.players[0].total-initialHero>=0?'+':''}${fmt(game.players[0].stack+game.players[0].total-initialHero)}`;",
              "$('handsPlayed').textContent=handsPlayed;",
              "$('seatPosition').textContent=posForSeat(0);"
          ]:
              block=block.replace(line,'')
          if 'function render(reveal=false)' not in cur:
              marker="function showHeroActions(){"
              s=cur.index(marker)
              e=cur.index('\n', s)
              cur=cur[:e+1]+block+cur[e+1:]
          p.write_text(cur)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
          grep -q 'function render(reveal=false)' index.html
          grep -q 'function showdown()' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix blank poker table initialization'
          git push

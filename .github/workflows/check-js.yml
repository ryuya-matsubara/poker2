name: Check poker2 JavaScript

on:
  push:
    paths:
      - '.github/workflows/check-js.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js

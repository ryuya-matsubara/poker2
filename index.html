<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1413">
<title>POKER ROOM 40BB</title>
<style>
:root{color-scheme:dark;--bg:#0b1413;--panel:#111e1c;--line:#29403b;--muted:#9ab1aa;--text:#f1f5ed;--green:#b8f36b;--gold:#e4bc72;--red:#f07878;--felt:#145044;--felt2:#0c3932}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#182b27 0,#0b1413 55%);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}.app{max-width:1240px;margin:auto;padding:20px clamp(12px,3vw,38px) 36px}header{display:flex;align-items:center;margin-bottom:15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border:1px solid #6d8851;border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:21px}.brand h1{font-size:18px;letter-spacing:.1em;margin:0}.table-wrap{position:relative;background:linear-gradient(145deg,#17614f,var(--felt) 50%,var(--felt2));border:8px solid #513a2b;border-radius:260px;min-height:500px;box-shadow:0 22px 50px #0007,inset 0 0 0 2px #a7854b,inset 0 0 60px #061c1890;display:grid;place-items:center;padding:60px 10%;overflow:hidden}.table-wrap:before{content:"";position:absolute;inset:12px;border:1px solid #88b6a342;border-radius:250px;pointer-events:none}.table-topline{position:absolute;top:25px;left:0;right:0;text-align:center;color:#d7eee2a8;font-size:10px;letter-spacing:.23em}.seats{position:absolute;inset:0}.seat{position:absolute;width:132px;min-height:68px;padding:7px 9px;text-align:center;border:1px solid #ffffff2a;background:#0b1816ed;border-radius:12px;box-shadow:0 5px 14px #0004;transform:translate(-50%,-50%);z-index:2}.seat.active{border-color:var(--green);box-shadow:0 0 0 2px #b8f36b3b,0 5px 16px #0005}.seat.hero{border-color:var(--gold)}.seat.folded{opacity:.5}.name{font-size:12px;font-weight:800}.stack,.bet{font-size:10px;color:#c7d8d1}.bet{color:var(--gold)}.action-label{display:inline-block;min-height:18px;margin-top:3px;padding:2px 7px;border-radius:999px;background:#29483f;color:#dff6e9;font-size:9px;font-weight:800}.seat.folded .action-label{background:#392d2b;color:#f1c3bd}.seat-cards{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);display:flex;gap:4px;white-space:nowrap}.mini-card{font-size:11px;background:#f6f3e9;color:#1b2925;border-radius:4px;padding:3px 5px;font-weight:bold;box-shadow:0 2px 5px #0006}.mini-card.red{color:#bb3540}.mini-card.back{background:#335b52;color:#d8eee1}.center{position:relative;z-index:1;text-align:center;width:min(100%,550px)}.pot{font-size:11px;letter-spacing:.16em;color:#c5e3d5}.pot strong{display:block;font-size:20px;color:#fff;letter-spacing:0}.board{display:flex;justify-content:center;gap:8px;min-height:78px;margin:18px 0}.card{width:53px;height:74px;background:#f7f4e8;color:#16231f;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px #0017;font-family:Georgia,serif}.card .rank{font-size:23px;line-height:1;font-weight:bold}.card .suit{font-size:20px;line-height:1}.card.red{color:#c23b43}.street{min-height:19px;color:#d0e7d9;font-size:11px;letter-spacing:.1em}.below{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}.play-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.play-head{display:flex;justify-content:space-between;gap:10px}.play-head h2{font-size:13px;letter-spacing:.11em;margin:0}.status{font-size:12px;color:var(--muted)}.hero-cards{display:flex;gap:8px;margin:18px 0 12px}.hero-cards .card{width:59px;height:82px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-top:15px}.action-choice{display:flex;flex:0 0 140px;flex-direction:column;align-items:center;gap:5px}.btn{border:1px solid #547144;background:var(--green);color:#14200f;padding:9px 12px;border-radius:9px;font-weight:800;width:140px;height:58px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}.btn.aggressive{background:var(--gold);border-color:var(--gold);color:#2a2114}.btn.danger{background:#392321;border-color:#6e3d39;color:#ffd9d4}.btn-line2{display:block;margin-top:3px;font-size:12px;font-weight:800}.action-pct{font-size:11px;font-weight:800;color:var(--muted);line-height:1}.result{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;font-size:13px;min-height:18px}.next-row{margin-top:10px}.next-row .btn{height:auto;width:auto;min-width:120px}.win{color:var(--green)}.loss{color:var(--red)}
@media(max-width:760px){.app{padding:13px 10px 25px}.table-wrap{min-height:430px;border-width:6px;border-radius:175px;padding:40px 3%}.table-wrap:before{inset:8px;border-radius:170px}.seat{width:92px;min-height:59px;padding:5px 4px}.name{font-size:10px}.stack,.bet{font-size:9px}.action-label{font-size:8px;padding:1px 5px}.seat-cards{top:calc(100% + 4px);gap:2px}.mini-card{font-size:9px;padding:2px 3px}.card{width:42px;height:60px}.card .rank{font-size:19px}.card .suit{font-size:17px}.board{gap:5px;margin:12px 0;min-height:64px}.action-choice{flex:1 1 30%;min-width:92px}.action-choice .btn{width:100%;height:58px;padding:8px 6px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="mark">♠</div><h1>POKER ROOM</h1></div></header>
<section class="table-wrap">
<div class="table-topline">NO LIMIT TEXAS HOLD'EM</div>
<div class="seats" id="seats"></div>
<div class="center"><div class="pot">POT<strong id="pot">0 BB</strong></div><div class="board" id="board"></div><div class="street" id="street"></div></div>
</section>
<section class="below"><div class="play-panel">
<div class="play-head"><h2>YOUR HAND</h2><span class="status" id="turnStatus">準備中</span></div>
<div class="hero-cards" id="heroCards"></div>
<div class="actions" id="actions"></div>
<div class="result" id="result"></div>
<div class="next-row" id="nextRow"></div>
</div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const SUITS=['♠','♥','♦','♣'],RANKS=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const DATA_URL='https://raw.githubusercontent.com/jensbaagaard/poker-practice/main/data/openSourcePokerData/MTT_40_GTO.json';
let ranges=null,game=null,button=0;
const fmt=n=>`${Number(n.toFixed(1))} BB`;
function position(i){const rel=(i-button+6)%6;return ['BTN','SB','BB','LJ','HJ','CO'][rel]}
function seatFor(pos){for(let i=0;i<6;i++)if(position(i)===pos)return i;return -1}
function label(i){return position(i)}
function makeDeck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push({r,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function cardHtml(c,mini=false,back=false){if(back)return '<span class="mini-card back">◆</span>';const red=c.s==='♥'||c.s==='♦';if(mini)return `<span class="mini-card ${red?'red':''}">${c.r}${c.s}</span>`;return `<div class="card ${red?'red':''}"><div class="rank">${c.r}</div><div class="suit">${c.s}</div></div>`}
function handKey(cards){let [a,b]=cards;let ia=RANKS.indexOf(a.r),ib=RANKS.indexOf(b.r);if(ia<ib)[a,b]=[b,a];return a.r+b.r+(a.r===b.r?'':a.s===b.s?'s':'o')}
function startHand(first=false){if(!first)button=(button+1)%6;game={players:Array.from({length:6},()=>({stack:40,hole:[],fold:false,allin:false,streetBet:0,liveTotal:0,action:''})),board:[],pot:0,deadPot:0,highest:1,queue:[],deck:makeDeck(),pre:{stage:0,opener:null,three:null,openSize:null,threeSize:null},done:false,revealAll:false};$('result').textContent='';$('nextRow').innerHTML='';for(let k=0;k<2;k++)for(const p of game.players)p.hole.push(game.deck.pop());const sb=seatFor('SB'),bb=seatFor('BB');commit(sb,.5,true,true);commit(bb,1,true,true);commit(bb,1,false,false);game.players[sb].action='SB';game.players[bb].action='BB + ANTE';game.queue=orderFrom(seatFor('LJ')).filter(i=>!game.players[i].allin);render();run()}
function orderFrom(start){return Array.from({length:6},(_,k)=>(start+k)%6)}
function commit(i,amount,countStreet=true,live=true){const p=game.players[i],x=Math.min(amount,p.stack);p.stack-=x;game.pot+=x;if(live)p.liveTotal+=x;else game.deadPot+=x;if(countStreet)p.streetBet+=x;if(p.stack<=1e-9)p.allin=true;return x}
function payTo(i,target){return commit(i,Math.max(0,target-game.players[i].streetBet),true,true)}
function active(){return game.players.map((p,i)=>({p,i})).filter(x=>!x.p.fold)}
function rebuildQueue(after){game.queue=orderFrom((after+1)%6).filter(i=>i!==after&&!game.players[i].fold&&!game.players[i].allin)}
function removeActor(i){if(game.queue[0]===i)game.queue.shift();else game.queue=game.queue.filter(x=>x!==i)}
function rankPos(pos){return {SB:0,BB:1,LJ:2,HJ:3,CO:4,BTN:5}[pos]??0}
function openTarget(i){return position(i)==='SB'?3.5:2.3}
function threeTarget(i){const open=game.pre.openSize||game.highest,hero=position(i),villain=game.pre.opener,ip=villain&&rankPos(hero)>rankPos(villain);return Math.min(open*(ip?3:4),ip?9:10)}
function legal(i){const p=game.players[i],toCall=Math.max(0,game.highest-p.streetBet),a=[];if(toCall>0)a.push(['fold','フォールド']);if(toCall===0)a.push(['check','チェック']);else a.push(['call','コール']);if(p.stack<=toCall+.001)return a;if(game.pre.stage===0){const t=openTarget(i);if(t>game.highest+.001)a.push(['bet',`オープン ${fmt(t)}`])}else if(game.pre.stage===1){const t=threeTarget(i);if(t>game.highest+.001)a.push(['raise','3ベット'])}else if(game.pre.stage===2){a.push(['allin','オールイン'])}return a}
function perform(i,act,fromCPU=false){if(game.done||game.queue[0]!==i)return;const p=game.players[i];let aggressive=false,text='';if(act==='fold'){p.fold=true;text='FOLD'}else if(act==='check'){text='CHECK'}else if(act==='call'){payTo(i,game.highest);text='CALL'}else if(act==='bet'){const t=openTarget(i);payTo(i,t);game.highest=t;game.pre.stage=1;game.pre.opener=position(i);game.pre.openSize=t;aggressive=true;text=`OPEN ${fmt(t)}`}else if(act==='raise'){const t=threeTarget(i);payTo(i,t);game.highest=t;game.pre.stage=2;game.pre.three=position(i);game.pre.threeSize=t;aggressive=true;text=`3BET ${fmt(t)}`}else if(act==='allin'){const t=p.streetBet+p.stack;payTo(i,t);if(t>game.highest){game.highest=t;aggressive=true}game.pre.stage=Math.max(3,game.pre.stage);text='ALL-IN'}p.action=text;if(aggressive)rebuildQueue(i);else removeActor(i);render();if(active().length===1)return endByFold();if(game.queue.length===0)return showdown();if(!fromCPU)run()}
function rangeVal(key,h){return ranges&&ranges[key]?Number(ranges[key][h]||0):0}
function conditional(n,d){return d<=1e-9?0:Math.max(0,Math.min(1,n/d))}
function strategy(i){if(!ranges)return null;const pos=position(i),h=handKey(game.players[i].hole),pr=game.pre;if(pr.stage===0){const r=rangeVal('Open'+pos,h),c=rangeVal('Limp'+pos,h);return {raise:r,call:c,fold:Math.max(0,1-r-c)}}if(pr.stage===1&&pr.opener&&pos!==pr.opener){const r=rangeVal(`3Bet${pos}vs${pr.opener}`,h),c=rangeVal(`Call${pos}vs${pr.opener}`,h);return {raise:r,call:c,fold:Math.max(0,1-r-c)}}if(pr.stage===2&&pr.opener&&pr.three&&pos===pr.opener){const base=rangeVal('Open'+pos,h),r=conditional(rangeVal(`4Bet${pos}vs${pr.three}`,h),base),c=conditional(rangeVal(`Call 3Bet${pos}vs${pr.three}`,h),base);return {raise:r,call:c,fold:Math.max(0,1-r-c)}}if(pr.stage>=3&&pr.opener&&pr.three&&pos===pr.three){const base=rangeVal(`3Bet${pos}vs${pr.opener}`,h),c=conditional(rangeVal(`Call 4Bet${pos}vs${pr.opener}`,h),base);return {raise:0,call:c,fold:1-c}}return null}
function choose(s,acts){const names=acts.map(x=>x[0]);if(!s)return names.includes('check')?'check':'fold';const aggr=names.includes('raise')?'raise':names.includes('bet')?'bet':names.includes('allin')?'allin':null;const opts=[];if(names.includes('fold'))opts.push(['fold',s.fold]);if(names.includes('call')||names.includes('check'))opts.push([names.includes('call')?'call':'check',s.call]);if(aggr)opts.push([aggr,s.raise]);let z=opts.reduce((n,x)=>n+x[1],0);if(z<=0)return names.includes('check')?'check':names.includes('fold')?'fold':'call';let r=Math.random()*z;for(const [a,w] of opts){r-=w;if(r<=0)return a}return opts[opts.length-1][0]}
function cpuAction(i){const acts=legal(i);return choose(strategy(i),acts)}
function run(){render();if(game.done||!game.queue.length)return;const i=game.queue[0];if(i===0)return showHeroActions();setTimeout(()=>{if(!game.done&&game.queue[0]===i){perform(i,cpuAction(i),true);run()}},900)}
function showHeroActions(){const acts=legal(0),s=strategy(0),names=acts.map(x=>x[0]),aggr=names.includes('raise')?'raise':names.includes('bet')?'bet':names.includes('allin')?'allin':null,p=game.players[0],toCall=Math.max(0,game.highest-p.streetBet);function pct(a){if(!s)return null;if(a==='fold')return s.fold;if(a==='call'||a==='check')return s.call;if(a===aggr)return s.raise;return 0}function buttonText(a,t){if(a==='call')return `コール<span class="btn-line2">${fmt(Math.min(toCall,p.stack))}</span>`;if(a==='raise')return `3ベット<span class="btn-line2">${fmt(threeTarget(0))}</span>`;if(a==='allin')return `オールイン<span class="btn-line2">${fmt(p.streetBet+p.stack)}</span>`;return t}$('actions').innerHTML=acts.map(([a,t])=>{const v=pct(a),q=v==null?'—':`${Math.round(v*100)}%`;return `<div class="action-choice"><button class="btn ${a==='fold'?'danger':(a==='bet'||a==='raise'||a==='allin')?'aggressive':''}" data-a="${a}"><span>${buttonText(a,t)}</span></button><div class="action-pct">${q}</div></div>`}).join('');$('actions').querySelectorAll('button').forEach(b=>b.onclick=()=>perform(0,b.dataset.a))}
function endByFold(){const w=active()[0].i,won=game.pot;game.players[w].stack+=won;game.pot=0;finish(`${label(w)} が ${fmt(won)} を獲得`,w===0)}
function showdown(){while(game.board.length<5)game.board.push(game.deck.pop());const eligible=active();const levels=[...new Set(game.players.map(p=>p.liveTotal).filter(x=>x>0))].sort((a,b)=>a-b),awards=Array(6).fill(0);let prev=0,first=true;for(const lv of levels){const contributors=game.players.map((p,i)=>({p,i})).filter(x=>x.p.liveTotal>=lv);let pot=(lv-prev)*contributors.length;if(first){pot+=game.deadPot;first=false}const contenders=eligible.filter(x=>x.p.liveTotal>=lv);if(contenders.length){const scores=contenders.map(x=>[x.i,bestScore(x.p.hole.concat(game.board))]),best=Math.max(...scores.map(x=>x[1])),wins=scores.filter(x=>x[1]===best).map(x=>x[0]);for(const w of wins)awards[w]+=pot/wins.length}prev=lv}if(first&&game.deadPot>0&&eligible.length){const scores=eligible.map(x=>[x.i,bestScore(x.p.hole.concat(game.board))]),best=Math.max(...scores.map(x=>x[1])),wins=scores.filter(x=>x[1]===best).map(x=>x[0]);for(const w of wins)awards[w]+=game.deadPot/wins.length}awards.forEach((x,i)=>game.players[i].stack+=x);game.pot=0;const text=awards.map((x,i)=>x>0?`${label(i)} が ${fmt(x)} を獲得`:null).filter(Boolean).join(' / ');finish(text,awards[0]>0)}
function finish(text,heroWin){game.done=true;game.queue=[];game.revealAll=true;game.players.forEach(p=>p.action='');render();$('result').innerHTML=`<span class="${heroWin?'win':'loss'}">${text}</span>`;$('actions').innerHTML='';$('nextRow').innerHTML='<button class="btn" id="nextHand">次のハンド</button>';$('nextHand').onclick=()=>startHand(false)}
function fiveScore(cs){const vals=cs.map(c=>RANKS.indexOf(c.r)+2).sort((a,b)=>b-a),cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);const uniq=[...new Set(vals)];if(uniq[0]===14)uniq.push(1);let sh=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4){sh=uniq[i];break}const flush=cs.every(c=>c.s===cs[0].s),groups=Object.entries(cnt).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v);let cat,k;if(flush&&sh){cat=8;k=[sh]}else if(groups[0].n===4){cat=7;k=[groups[0].v,groups[1].v]}else if(groups[0].n===3&&groups[1].n===2){cat=6;k=[groups[0].v,groups[1].v]}else if(flush){cat=5;k=vals}else if(sh){cat=4;k=[sh]}else if(groups[0].n===3){cat=3;k=[groups[0].v,...groups.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)]}else if(groups[0].n===2&&groups[1].n===2){const ps=[groups[0].v,groups[1].v].sort((a,b)=>b-a);cat=2;k=[...ps,groups.find(x=>x.n===1).v]}else if(groups[0].n===2){cat=1;k=[groups[0].v,...groups.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)]}else{cat=0;k=vals}let n=cat*1e10;for(let i=0;i<5;i++)n+=(k[i]||0)*Math.pow(15,4-i);return n}
function bestScore(cs){let best=-1,n=cs.length;for(let a=0;a<n-4;a++)for(let b=a+1;b<n-3;b++)for(let c=b+1;c<n-2;c++)for(let d=c+1;d<n-1;d++)for(let e=d+1;e<n;e++)best=Math.max(best,fiveScore([cs[a],cs[b],cs[c],cs[d],cs[e]]));return best}
function render(){if(!game)return;const coords=[[50,83],[18,68],[18,28],[50,16],[82,28],[82,68]];$('seats').innerHTML=game.players.map((p,i)=>{const [x,y]=coords[i],show=i===0||game.revealAll,foldClass=p.fold&&!game.revealAll?'folded':'';return `<div class="seat ${i===0?'hero':''} ${foldClass} ${game.queue[0]===i?'active':''}" style="left:${x}%;top:${y}%"><div class="name">${position(i)}${i===button?' · D':''}</div><div class="stack">${fmt(p.stack)}</div><div class="bet">投入 ${fmt(p.liveTotal)}</div><span class="action-label">${p.action||' '}</span><div class="seat-cards">${show?p.hole.map(c=>cardHtml(c,true)).join(''):p.fold?'':cardHtml(null,true,true)+cardHtml(null,true,true)}</div></div>`}).join('');$('pot').textContent=fmt(game.pot);$('board').innerHTML=game.board.map(c=>cardHtml(c)).join('');$('street').textContent=game.done?'':'PREFLOP';$('heroCards').innerHTML=game.players[0].hole.map(c=>cardHtml(c)).join('');$('turnStatus').textContent=game.done?'':game.queue[0]===0?'あなたの番':game.queue.length?`${position(game.queue[0])} の番`:'処理中';if(game.queue[0]!==0&&!game.done)$('actions').innerHTML=''}
fetch(DATA_URL).then(r=>r.ok?r.json():Promise.reject(new Error('range load failed'))).then(x=>{ranges=x}).catch(()=>{ranges=null}).finally(()=>startHand(true));
})();
</script>
</body>
</html>

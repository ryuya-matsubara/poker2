<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1413">
<title>POKER ROOM 40BB — Texas Hold'em</title>
<style>
:root{color-scheme:dark;--bg:#0b1413;--panel:#111e1c;--panel2:#172724;--line:#29403b;--muted:#9ab1aa;--text:#f1f5ed;--green:#b8f36b;--gold:#e4bc72;--red:#f07878;--felt:#145044;--felt2:#0c3932}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#182b27 0,#0b1413 55%);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}.app{max-width:1240px;margin:auto;padding:20px clamp(12px,3vw,38px) 36px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border:1px solid #6d8851;border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:21px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--green);font-weight:800}.brand h1{font-size:18px;letter-spacing:.1em;margin:1px 0}.top-meta{font-size:11px;color:var(--muted);text-align:right}.top-meta strong{color:var(--text)}.notice{font-size:11px;color:#d7c58f;background:#191d18;border:1px solid #4d4b38;border-radius:10px;padding:9px 12px;margin-bottom:14px}.table-wrap{position:relative;background:linear-gradient(145deg,#17614f,var(--felt) 50%,var(--felt2));border:8px solid #513a2b;border-radius:260px;min-height:500px;box-shadow:0 22px 50px #0007,inset 0 0 0 2px #a7854b,inset 0 0 60px #061c1890;display:grid;place-items:center;padding:60px 10%;overflow:hidden}.table-wrap:before{content:"";position:absolute;inset:12px;border:1px solid #88b6a342;border-radius:250px;pointer-events:none}.table-topline{position:absolute;top:25px;left:0;right:0;text-align:center;color:#d7eee2a8;font-size:10px;letter-spacing:.23em}.seats{position:absolute;inset:0}.seat{position:absolute;width:132px;min-height:68px;padding:7px 9px;text-align:center;border:1px solid #ffffff2a;background:#0b1816ed;border-radius:12px;box-shadow:0 5px 14px #0004;transform:translate(-50%,-50%);z-index:2}.seat.active{border-color:var(--green);box-shadow:0 0 0 2px #b8f36b3b,0 5px 16px #0005}.seat.hero{border-color:var(--gold)}.seat.folded{opacity:.5}.name{font-size:12px;font-weight:750}.stack,.bet{font-size:10px;color:#c7d8d1}.bet{color:var(--gold)}.badge{font-size:9px;color:var(--green);margin-left:4px}.action-label{display:inline-block;min-height:18px;margin-top:3px;padding:2px 7px;border-radius:999px;background:#29483f;color:#dff6e9;font-size:9px;font-weight:800}.seat.folded .action-label{background:#392d2b;color:#f1c3bd}.seat-cards{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);display:flex;gap:4px;white-space:nowrap}.mini-card{font-size:11px;background:#f6f3e9;color:#1b2925;border-radius:4px;padding:3px 5px;font-weight:bold;box-shadow:0 2px 5px #0006}.mini-card.red{color:#bb3540}.mini-card.back{background:#335b52;color:#d8eee1}.center{position:relative;z-index:1;text-align:center;width:min(100%,550px)}.pot{font-size:11px;letter-spacing:.16em;color:#c5e3d5}.pot strong{display:block;font-size:20px;color:#fff;letter-spacing:0}.board{display:flex;justify-content:center;gap:8px;min-height:78px;margin:18px 0}.card{width:53px;height:74px;background:#f7f4e8;color:#16231f;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px #0017;font-family:Georgia,serif}.card .rank{font-size:23px;line-height:1;font-weight:bold}.card .suit{font-size:20px;line-height:1}.card.red{color:#c23b43}.street{min-height:19px;color:#d0e7d9;font-size:11px;letter-spacing:.1em}.below{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}.play-panel,.side-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.play-head{display:flex;justify-content:space-between;gap:10px}.play-head h2,.side-panel h2{font-size:13px;letter-spacing:.11em;margin:0}.status{font-size:12px;color:var(--muted)}.hero-cards{display:flex;gap:8px;margin:18px 0 12px}.hero-cards .card{width:59px;height:82px}.hint,.advice{font-size:12px;color:var(--muted);min-height:18px}.advice{font-size:11px;color:#d6ebd4;line-height:1.6;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:1px solid #547144;background:var(--green);color:#14200f;padding:10px 14px;border-radius:9px;font-weight:800;min-width:92px}.btn.aggressive{background:var(--gold);border-color:var(--gold);color:#2a2114}.btn.danger{background:#392321;border-color:#6e3d39;color:#ffd9d4}.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}.result{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;font-size:12px;min-height:17px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#172522;border:1px solid #243b35;border-radius:9px;padding:10px}.stat span{display:block;font-size:10px;color:var(--muted)}.stat strong{font-size:15px}.log{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.log-title{font-size:10px;color:var(--muted);letter-spacing:.1em}.log-list{max-height:160px;overflow:auto;font-size:11px;color:#c6d4ce}.log-list div{padding:4px 0;border-bottom:1px solid #ffffff0a}.note{margin-top:14px;font-size:11px;color:#829a92;line-height:1.55}.modal{position:fixed;inset:0;background:#07100fd9;display:grid;place-items:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modal-box{width:min(100%,440px);background:#15221f;border:1px solid #405c52;border-radius:16px;padding:24px;box-shadow:0 20px 60px #000a}.modal-box h2{margin:0 0 10px}.modal-box p{font-size:13px;line-height:1.7;white-space:pre-line}.win{color:var(--green)}.loss{color:var(--red)}
@media(max-width:760px){.app{padding:13px 10px 25px}.table-wrap{min-height:430px;border-width:6px;border-radius:175px;padding:40px 3%}.table-wrap:before{inset:8px;border-radius:170px}.seat{width:92px;min-height:59px;padding:5px 4px}.name{font-size:10px}.stack,.bet{font-size:9px}.badge{font-size:7px}.action-label{font-size:8px;padding:1px 5px}.seat-cards{top:calc(100% + 4px);gap:2px}.mini-card{font-size:9px;padding:2px 3px}.card{width:42px;height:60px}.card .rank{font-size:19px}.card .suit{font-size:17px}.board{gap:5px;margin:12px 0;min-height:64px}.below{grid-template-columns:1fr}.actions .btn{flex:1;min-width:72px;padding:10px 7px}.top-meta{font-size:10px}}
</style>
</head><body>
<main class="app">
<header><div class="brand"><div class="mark">♠</div><div><h1>POKER ROOM</h1></div></div></header>
<section class="table-wrap"><div class="table-topline">NO LIMIT TEXAS HOLD'EM</div><div class="seats" id="seats"></div><div class="center"><div class="pot">POT<strong id="pot">0 BB</strong></div><div class="board" id="board"></div><div class="street" id="street"></div></div></section>
<section class="below"><div class="play-panel"><div class="play-head"><h2>YOUR HAND</h2><span class="status" id="turnStatus">準備中</span></div><div class="hero-cards" id="heroCards"></div><div class="actions" id="actions"></div><div class="result" id="result"></div></div></section>
</main>
<div class="modal" id="modal" hidden><div class="modal-box"><h2 id="modalTitle">ハンド終了</h2><p id="modalText"></p><div class="actions"><button class="btn" id="nextHand">次のハンド</button><button class="btn ghost" id="closeModal">閉じる</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SUITS=['♠','♥','♦','♣'],RANKS=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const DATA_URL='https://raw.githubusercontent.com/jensbaagaard/poker-practice/main/data/openSourcePokerData/MTT_40_GTO.json';
let ranges=null,game=null,handsPlayed=0,initialHero=40,button=0,history=[];
fetch(DATA_URL).then(r=>r.ok?r.json():Promise.reject()).then(x=>{ranges=x;log('公開40BB GTOレンジを読み込みました');render()}).catch(()=>{log('GTOレンジを取得できないため簡易戦略で動作します');render()});
const fmt=n=>`${n.toFixed(Math.abs(n-Math.round(n))<1e-6?0:1)} BB`;
function log(s){history.unshift(s);history=history.slice(0,40);if($('log'))$('log').innerHTML=history.map(x=>`<div>${x}</div>`).join('')}
function deck(){let d=[];for(const r of RANKS)for(const s of SUITS)d.push({r,s});for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function posForSeat(i){let rel=(i-button+6)%6;return ['BTN','SB','BB','LJ','HJ','CO'][rel]}
function seatForPos(p){for(let i=0;i<6;i++)if(posForSeat(i)===p)return i;return -1}
function handKey(cards){let a=cards[0],b=cards[1],ia=RANKS.indexOf(a.r),ib=RANKS.indexOf(b.r);if(ia<ib)[a,b]=[b,a];return a.r+b.r+(a.r===b.r?'':a.s===b.s?'s':'o')}
function cardHtml(c,mini=false,back=false){if(back)return `<span class="mini-card back">◆</span>`;let red=c.s==='♥'||c.s==='♦';if(mini)return `<span class="mini-card ${red?'red':''}">${c.r}${c.s}</span>`;return `<div class="card ${red?'red':''}"><div class="rank">${c.r}</div><div class="suit">${c.s}</div></div>`}
function startHand(reset=false){
 if(!game||reset){game={players:Array.from({length:6},(_,i)=>({name:i===0?'あなた':`CPU${i}`,stack:40,hole:[],fold:false,allin:false,contrib:0,streetBet:0,action:'',total:0})),board:[],street:'preflop',pot:0,highest:1,queue:[],deck:[],pre:{opener:null,three:null,stage:0,openSize:null,threeSize:null},done:false};}
 else{game.players.forEach(p=>{p.stack=40;p.hole=[];p.fold=false;p.allin=false;p.contrib=0;p.streetBet=0;p.action='';p.total=0});game.board=[];game.street='preflop';game.pot=0;game.highest=1;game.queue=[];game.deck=[];game.pre={opener:null,three:null,stage:0,openSize:null,threeSize:null};game.done=false;button=(button+1)%6;}
 handsPlayed++;game.deck=deck();for(let k=0;k<2;k++)for(const p of game.players)p.hole.push(game.deck.pop());
 const sb=seatForPos('SB'),bb=seatForPos('BB');commit(sb,.5,true);commit(bb,1,true);commit(bb,1,false,true);game.players[sb].action='SB';game.players[bb].action='BB + ante';
 game.highest=1;game.queue=orderFrom(seatForPos('LJ')).filter(i=>!game.players[i].allin);log(`Hand ${handsPlayed} — BTN: ${game.players[button].name}`);render();run();}
function orderFrom(start){return Array.from({length:6},(_,k)=>(start+k)%6)}
function commit(i,amount,counts=true){let p=game.players[i],x=Math.min(amount,p.stack);p.stack-=x;p.total+=x;game.pot+=x;if(counts){p.contrib+=x;p.streetBet+=x}if(p.stack<=1e-9)p.allin=true;return x}
function payTo(i,target){let p=game.players[i],need=Math.max(0,target-p.streetBet);return commit(i,need,true)}
function rebuildQueue(after){game.queue=orderFrom((after+1)%6).filter(i=>i!==after&&!game.players[i].fold&&!game.players[i].allin)}
function removeActor(i){if(game.queue[0]===i)game.queue.shift();else game.queue=game.queue.filter(x=>x!==i)}
function postflopRank(pos){return {SB:0,BB:1,LJ:2,HJ:3,CO:4,BTN:5}[pos]??0}
function openTarget(i){return posForSeat(i)==='SB'?3.5:2.3}
function threeBetTarget(i){let pr=game.pre,open=pr.openSize||game.highest,hero=posForSeat(i),villain=pr.opener,ip=villain&&postflopRank(hero)>postflopRank(villain),mult=ip?3:4,cap=ip?9:10;return Math.min(open*mult,cap)}
function legal(i){let p=game.players[i],toCall=Math.max(0,game.highest-p.streetBet);if(game.street!=='preflop')return postLegal(i,toCall);let a=[];if(toCall>0)a.push(['fold','フォールド']);if(toCall===0)a.push(['check','チェック']);else a.push(['call',`コール ${fmt(Math.min(toCall,p.stack))}`]);if(p.stack>toCall+.001){if(game.pre.stage===0){let t=openTarget(i);if(t>game.highest+.001)a.push(['bet',`オープン ${fmt(t)}`])}else if(game.pre.stage===1){let t=threeBetTarget(i);if(t>game.highest+.001)a.push(['raise',`3ベット ${fmt(t)}`])}else if(game.pre.stage===2){a.push(['allin',`4ベット オールイン ${fmt(p.stack+p.streetBet)}`])}}return a}
function postLegal(i,toCall){let p=game.players[i],a=[];if(toCall>0)a.push(['fold','フォールド'],['call',`コール ${fmt(Math.min(toCall,p.stack))}`]);else a.push(['check','チェック']);if(p.stack>toCall+.001){if(toCall===0){a.push(['bet33','ベット 1/3 POT'],['bet75','ベット 3/4 POT'])}else a.push(['raise','レイズ']);a.push(['allin',`オールイン ${fmt(p.stack+p.streetBet)}`])}return a}
function perform(i,act,fromCPU=false){if(game.done||game.queue[0]!==i)return;let p=game.players[i],toCall=Math.max(0,game.highest-p.streetBet),aggr=false,label='';
 if(act==='fold'){p.fold=true;label='FOLD'}else if(act==='check'){label='CHECK'}else if(act==='call'){payTo(i,game.highest);label='CALL'}
 else if(act==='bet'){let target=openTarget(i);payTo(i,target);game.highest=target;aggr=true;label=`OPEN ${fmt(target)}`;if(!game.pre.opener){game.pre.opener=posForSeat(i);game.pre.openSize=target;game.pre.stage=1}}
 else if(act==='raise'&&game.street==='preflop'){let target=threeBetTarget(i);payTo(i,target);game.highest=target;aggr=true;label=`3BET ${fmt(target)}`;game.pre.three=posForSeat(i);game.pre.threeSize=target;game.pre.stage=2}
 else if(act==='allin'){let target=p.streetBet+p.stack;payTo(i,target);if(target>game.highest+1e-9){game.highest=target;aggr=true}label='ALL-IN';if(game.street==='preflop')game.pre.stage=Math.max(game.pre.stage,3)}
 else if(act==='bet33'||act==='bet75'||(act==='raise'&&game.street!=='preflop')){let target;if(act==='bet33')target=p.streetBet+Math.max(1,game.pot/3);else if(act==='bet75')target=p.streetBet+Math.max(1,game.pot*.75);else target=Math.min(p.streetBet+p.stack,game.highest+Math.max(game.highest,game.pot*.6));target=Math.min(target,p.streetBet+p.stack);payTo(i,target);if(target>game.highest){game.highest=target;aggr=true}label=act==='raise'?'RAISE':'BET'}
 p.action=label;log(`${p.name} (${posForSeat(i)}): ${label}`);if(aggr)rebuildQueue(i);else removeActor(i);render();if(active().length<=1)return endByFold();if(game.queue.length===0)return finishStreet();if(!fromCPU)run();}
function active(){return game.players.map((p,i)=>({p,i})).filter(x=>!x.p.fold)}
function finishStreet(){while(game.board.length<5)game.board.push(game.deck.pop());return showdown()}
function run(){render();if(game.done||!game.queue.length)return;let i=game.queue[0];if(i===0){showHeroActions();return}setTimeout(()=>{if(!game.done&&game.queue[0]===i)perform(i,cpuAction(i),true);run()},420)}
function rangeVal(key,hand){return ranges&&ranges[key]&&Number(ranges[key][hand]||0)||0}
function conditional(num,den){if(den<=1e-9)return 0;return Math.max(0,Math.min(1,num/den))}
function preStrategy(i){if(!ranges)return null;let pos=posForSeat(i),h=handKey(game.players[i].hole),pr=game.pre;
 if(pr.stage===0){let r=rangeVal('Open'+pos,h),c=rangeVal('Limp'+pos,h);return {raise:r,call:c,fold:Math.max(0,1-r-c),source:'Open/Limp'}}
 if(pr.stage===1&&pr.opener&&pos!==pr.opener){let r=rangeVal(`3Bet${pos}vs${pr.opener}`,h),c=rangeVal(`Call${pos}vs${pr.opener}`,h);return {raise:r,call:c,fold:Math.max(0,1-r-c),source:'vs raise'}}
 if(pr.stage===2&&pr.opener&&pr.three&&pos===pr.opener){let base=rangeVal('Open'+pos,h),r=conditional(rangeVal(`4Bet${pos}vs${pr.three}`,h),base),c=conditional(rangeVal(`Call 3Bet${pos}vs${pr.three}`,h),base);return {raise:r,call:c,fold:Math.max(0,1-r-c),source:'vs 3bet'}}
 if(pr.stage>=3&&pr.opener&&pr.three&&pos===pr.three){let base=rangeVal(`3Bet${pos}vs${pr.opener}`,h),c=conditional(rangeVal(`Call 4Bet${pos}vs${pr.opener}`,h),base);return {raise:0,call:c,fold:1-c,source:'vs all-in'}}return null}
function weightedChoice(s,legalActs){let map=legalActs.map(x=>x[0]),opts=[];if(map.includes('bet')||map.includes('raise')||map.includes('allin'))opts.push(['aggr',s.raise]);if(map.includes('call')||map.includes('check'))opts.push(['call',s.call]);if(map.includes('fold'))opts.push(['fold',s.fold]);let z=opts.reduce((a,x)=>a+x[1],0);if(z<=0)return map.includes('check')?'check':map.includes('fold')?'fold':'call';let r=Math.random()*z,c=0,cat='fold';for(const [k,w] of opts){c+=w;if(r<=c){cat=k;break}}if(cat==='aggr'){if(map.includes('raise'))return 'raise';if(map.includes('bet'))return 'bet';return 'allin'}if(cat==='call')return map.includes('call')?'call':'check';return 'fold'}
function cpuAction(i){let acts=legal(i),s=preStrategy(i);if(s)return weightedChoice(s,acts);return fallbackPre(i,acts)}
function fallbackPre(i,acts){let h=handKey(game.players[i].hole),sc=preHandScore(h),map=acts.map(x=>x[0]),tc=game.highest-game.players[i].streetBet;if(map.includes('check')&&sc<.28)return 'check';if(sc>.86&&map.includes('allin'))return 'allin';if(sc>.72&&map.includes('raise'))return 'raise';if(sc>.68&&map.includes('bet'))return 'bet';if(sc>.36&&map.includes('call'))return 'call';return map.includes('check')?'check':'fold'}
function preHandScore(h){let a=RANKS.indexOf(h[0]),b=RANKS.indexOf(h[1]),pair=h.length===2,s=h.endsWith('s');if(pair)return .48+a/24;let hi=Math.max(a,b),lo=Math.min(a,b),gap=hi-lo;return Math.min(.95,.16+hi*.045+lo*.018+(s?.08:0)+(gap<=1?.07:gap===2?.025:0))}
function fallbackPost(i,acts){let map=acts.map(x=>x[0]),strength=roughStrength(game.players[i].hole,game.board);let toCall=game.highest-game.players[i].streetBet,pot=game.pot,need=toCall/(pot+toCall||1);if(toCall>0){if(strength<need*.9)return 'fold';if(strength>.82&&map.includes('allin')&&Math.random()<.18)return 'allin';if(strength>.72&&map.includes('raise')&&Math.random()<.35)return 'raise';return 'call'}if(strength>.78&&map.includes('bet75'))return 'bet75';if(strength>.58&&map.includes('bet33')&&Math.random()<.65)return 'bet33';if(strength<.3&&map.includes('bet33')&&Math.random()<.12)return 'bet33';return 'check'}
function roughStrength(hole,board){let s=bestScore(hole.concat(board));let cat=Math.floor(s/1e10);return Math.min(.99,.18+cat*.11+(s%1e10)/1e11)}
function showHeroActions(){let acts=legal(0);$('actions').innerHTML=acts.map(([a,t])=>`<button class="btn ${a==='fold'?'danger':(a.includes('bet')||a==='raise'||a==='allin')?'aggressive':''}" data-a="${a}">${t}</button>`).join('');$('actions').querySelectorAll('button').forEach(b=>b.onclick=()=>perform(0,b.dataset.a));}
$('nextHand').onclick=()=>{$('modal').hidden=true;startHand(false)};$('closeModal').onclick=()=>$('modal').hidden=true;startHand(true);
})();
</script></body></html>
